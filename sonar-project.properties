# SonarQube project for mobile-sdk-ios (read by .github/workflows/sonarqube-pr-scan.yml).
# If the project is created in SonarQube with a different key (e.g. imported from
# GitHub), put that key here.
sonar.projectKey=vunetsystems_mobile-sdk-ios
sonar.projectName=mobile-sdk-ios
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/vendor/**,**/node_modules/**,**/testdata/**,**/*.pb.go
# C/C++/Objective-C need a build-wrapper compilation database; disabled until one is set up.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
